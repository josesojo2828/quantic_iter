
services:
  mentor_mongo:
    image: mongo:4.4
    container_name: mentor_mongo
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    networks:
      - mentor_network
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate() }" | mongo --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  mentor_redis:
    image: redis:latest
    container_name: mentor_redis
    ports:
      - "6380:6379"
    networks:
      - mentor_network
    deploy:
      resources:
        limits:
          memory: 256M

  mentor_rabbitmq:
    image: rabbitmq:3-management
    container_name: mentor_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - mentor_network
    deploy:
      resources:
        limits:
          memory: 512M

  mentor-minio:
    image: minio/minio:latest
    container_name: mentor-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - mentor_network
    deploy:
      resources:
        limits:
          memory: 512M

  mentor_kafka:
    image: apache/kafka:latest
    container_name: mentor_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://mentor_kafka:29092,EXTERNAL://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@mentor_kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    networks:
      - mentor_network
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  mentor_network:
    external: true
    name: mentor_network

volumes:
  mongo_data:
  minio_data:
