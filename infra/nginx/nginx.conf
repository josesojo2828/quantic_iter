worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;

    # Required for WebSocket proxying
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Backend Services Upstreams
    upstream auth_service { server auth-tenant:3000; }
    
    # Frontend Services Upstreams
    upstream app_main { server app-main:3001; }
    upstream admin_front { server admin-front:3002; }

    # Workshop Main App (localhost)
    server {
        listen 80;
        server_name localhost;

        # API Routing
        location /api/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Admin Redirect (Optional but convenient)
        location ^~ /admin {
            return 301 $scheme://admin.localhost/;
        }

        # Next.js HMR WebSocket
        location /_next/webpack-hmr {
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Default: app-main
        location / {
            proxy_pass http://app_main;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Admin Dashboard (admin.localhost)
    server {
        listen 80;
        server_name admin.localhost;

        # API Routing for Admin (Still pointing to same backend)
        location /api/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Next.js HMR WebSocket for Admin
        location /_next/webpack-hmr {
            proxy_pass http://admin_front;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Default: admin-front
        location / {
            proxy_pass http://admin_front;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
